trigger:
  branches:
    include:
      - microservices
  paths:
    include:
      - Backend/UserServices/**
      - NuGet.Config
      - azure-pipelines-user-service.yml

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  projectPath: Backend/UserServices/UserServices.csproj
  dockerfilePath: Backend/UserServices/Dockerfile
  imageRepository: ecommerce-user-service

steps:
  - task: UseDotNet@2
    displayName: Install .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.x

  - script: |
      dotnet restore $(projectPath) --configfile NuGet.Config
    displayName: Restore User Service packages

  - script: |
      dotnet build $(projectPath) --configuration $(buildConfiguration) --no-restore
    displayName: Build User Service

  - task: Docker@2
    displayName: Build and push User Service image to ACR
    inputs:
      containerRegistry: AzureContainerRegistryConnection
      repository: $(imageRepository)
      command: buildAndPush
      Dockerfile: $(dockerfilePath)
      buildContext: Backend
      tags: |
        $(Build.BuildId)
        latest
